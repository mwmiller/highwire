name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  precommit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - name: libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get

      # The engine must build from the locked dep. Tests run with :ssb
      # off, so nothing else would catch a broken engine bump until a
      # release build.
      - run: mix engine.build

      # format --check-formatted, credo --strict, compile
      # --warnings-as-errors, test
      - run: mix precommit
