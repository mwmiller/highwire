name: Audit

# Neither dependency tree had an advisory gate: a crate or a Hex
# package fixed in a patch release only surfaced when someone ran the
# audit by hand. Both are scanned on every push and pull request, on any
# branch, and a newly published advisory fails the first run after it
# lands.

on:
  push:
  pull_request:

jobs:
  rust-advisories:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      # Pinned: the advisory IDs and the audit.toml keys this project
      # relies on are version specific. The database itself is fetched
      # fresh on every run, so a newly published advisory fails here the
      # first push after it lands.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      # Run from src-tauri so cargo-audit picks up its .cargo/audit.toml.
      - name: Scan the Rust shell's lockfile
        working-directory: src-tauri
        run: cargo audit --file Cargo.lock

  elixir-advisories:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4

      - run: mix local.hex --force && mix local.rebar --force

      # hex.audit only reads mix.lock, but mix refuses to run a task
      # while the manifest's dependencies are unresolved, so they are
      # fetched first. Nothing is compiled.
      - run: mix deps.get

      # Retired packages and Hex security advisories for every entry in
      # mix.lock.
      - name: Scan the Elixir lockfile
        run: mix hex.audit
