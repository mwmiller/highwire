name: Release

# Tag push → three native builds (no cross-compiling: each runner builds
# its own Burrito backend with BURRITO_TARGET, so the enacl NIF links
# against the host), bundles the Tauri shell around it, and attaches the
# installers to the GitHub release for that tag.
#
#   macos-14   → HighWire.app + .dmg      (backend: aarch64-apple-darwin)
#   ubuntu-22.04 → .deb + .AppImage       (backend: x86_64-unknown-linux-gnu)
#   windows-2022 → NSIS -setup.exe        (backend: x86_64-pc-windows-msvc)
#
# Known gaps: the Windows enacl build needs sodium.dll beside the
# backend at runtime (that job is expected to need more work). The
# erlbutt engine IS embedded — this workflow builds its prod profile
# with bundled ERTS into priv/erlbutt, and the sidecar prefers that
# copy's own erts over any system Erlang.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            burrito_target: macos
            backend: highwire_macos
            triple: aarch64-apple-darwin
            sidecar: highwire-backend-aarch64-apple-darwin
            tauri_conf: ""
          - os: ubuntu-22.04
            burrito_target: linux
            backend: highwire_linux
            triple: x86_64-unknown-linux-gnu
            sidecar: highwire-backend-x86_64-unknown-linux-gnu
            tauri_conf: tauri.linux.conf.json
          - os: windows-2022
            burrito_target: windows
            backend: highwire_windows.exe
            triple: x86_64-pc-windows-msvc
            sidecar: highwire-backend-x86_64-pc-windows-msvc.exe
            tauri_conf: tauri.windows.conf.json
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.burrito_target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Unix toolchain: every tool pinned in .tool-versions (elixir,
      # erlang, rust, zig, node) in one step. mise has no Windows
      # support — that job sets its toolchain up piecewise below.
      - uses: jdx/mise-action@v2
        if: runner.os != 'Windows'

      - uses: erlef/setup-beam@v1
        if: runner.os == 'Windows'
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: dtolnay/rust-toolchain@1.98.1
        if: runner.os == 'Windows'

      - name: zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "0.16.0"
          $zip = "zig-x86_64-windows-$v.zip"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$v/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP\zig
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig"

      # Burrito compiles its C wrapper; enacl links -lsodium and Tauri
      # needs the WebKitGTK stack on Linux.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: vcpkg libsodium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libsodium:x64-windows
          # vcpkg guarantees installed/<triplet>/{lib,include}. A
          # recursive search for the import lib can match a buildtrees
          # artifact whose sibling include\ has no sodium.h — use the
          # canonical prefix and verify the header is really there.
          $prefix = @($env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg') |
            Where-Object { $_ } | Select-Object -Unique |
            ForEach-Object { Join-Path $_ 'installed\x64-windows' } |
            Where-Object { Test-Path (Join-Path $_ 'include\sodium.h') } |
            Select-Object -First 1
          if (-not $prefix) {
            Write-Host "::error::vcpkg prefix with installed\x64-windows\include\sodium.h not found"
            exit 1
          }
          $libdir = Join-Path $prefix 'lib'
          $lib = @((Join-Path $libdir 'sodium.lib'), (Join-Path $libdir 'libsodium.lib')) |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lib) { Write-Host "::error::sodium import lib not found under $libdir"; exit 1 }
          Write-Host "import lib: $lib"
          Copy-Item $lib (Join-Path $libdir 'libsodium.dll.a')
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$libdir;$env:LIB"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$(Join-Path $prefix 'include');$env:INCLUDE"
          # The port compiler runs gcc-style on this runner (its
          # diagnostics are gcc's; MSVC would read INCLUDE and find
          # the header) — give gcc the same -I/-L knobs the macOS
          # step uses. Forward slashes: gcc on Windows wants them.
          $incf = (Join-Path $prefix 'include') -replace '\\', '/'
          $libf = $libdir -replace '\\', '/'
          Add-Content -Path $env:GITHUB_ENV -Value "CFLAGS=-I$incf $env:CFLAGS"
          Add-Content -Path $env:GITHUB_ENV -Value "LDFLAGS=-L$libf $env:LDFLAGS"

      - name: system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libsodium
          # Homebrew's libsodium sits outside clang's default search
          # path, and enacl's port_env only adds -I/-L on FreeBSD and
          # Solaris. Job-wide (GITHUB_ENV): the engine build and mix's
          # own enacl dep both compile against it.
          echo "CFLAGS=-I$(brew --prefix)/include ${CFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"

      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # The engine the sidecar spawns: erlbutt's prod release — its own
      # ERTS (so the shipped app needs no system Erlang), the real
      # network id, and native NIFs built for this runner's OS — into
      # priv/. mix release snapshots priv, so it rides inside the
      # Burrito wrapper; the release.yml runtime config points the
      # sidecar at it. erlbutt is public, so a plain shallow clone —
      # upstream is built UNMODIFIED. Two environment knobs only:
      #
      #   ERL_COMPILER_OPTIONS — OTP 29 deprecates the bare `catch`
      #     idiom the codebase deliberately uses (and the old
      #     binding-in-filter comprehension style); both are fatal
      #     under erlbutt's warnings_as_errors. Suppress the warning
      #     classes rather than patching a repo we clone as-is.
      #   CFLAGS/LDFLAGS (macOS) — exported job-wide by the system
      #     libraries step above: Homebrew's libsodium is outside
      #     clang's default search path. apt's Linux paths are already
      #     default; Windows uses the vcpkg INCLUDE/LIB env.
      - name: Build and embed the erlbutt engine
        env:
          ERL_COMPILER_OPTIONS: '[nowarn_deprecated_catch, nowarn_export_var_subexpr]'
        run: |
          # mise's shims resolve tool versions by walking up from the
          # CWD. The clone lives in $RUNNER_TEMP, outside this repo's
          # .tool-versions, so rebar3's `#!/usr/bin/env escript` would
          # die with "No version is set for shim". Put the real erlang
          # bin ahead of the shims for this step (resolved here, where
          # the repo config still applies). mise is only installed on
          # Unix — setup-beam provides escript on Windows.
          if command -v mise >/dev/null 2>&1; then
            export PATH="$(dirname "$(mise which erl)"):$PATH"
          fi
          git clone --depth 1 https://github.com/cmoid/erlbutt.git "$RUNNER_TEMP/erlbutt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # git/hex must fail fast instead of sitting on a credential
            # prompt (a headless hang shows zero output), and rebar3 is
            # bounded so a stall surfaces as a step failure with the
            # last phase marker visible in the log.
            export GIT_TERMINAL_PROMPT=0
            # git-bash exports TMPDIR=/tmp (POSIX), which win32 file
            # ops resolve root-relative (\tmp\...) — rebar3 then hangs
            # 15m in its plugin-install temp move. Pin every temp var
            # under the workspace so source and destination share a
            # drive.
            export TMP="$RUNNER_TEMP/tmp"
            export TEMP="$TMP"
            export TMPDIR="$TMP"
            mkdir -p "$TMP"
            export HEX_HTTP_TIMEOUT=120
            echo "== phase: hex.pm probe =="
            curl -sS -IL --max-time 30 https://repo.hex.pm/tarballs/rebar3_auto-0.6.0.tar \
              -w 'probe: code=%{http_code} time=%{time_total}s\n' -o /dev/null \
              || echo "== phase: hex.pm probe FAILED =="
            echo "== phase: erlang dns probe =="
            timeout 30 erl -noshell -eval \
              'io:format("dns: ~p~n", [inet_res:lookup("repo.hex.pm", in, a)]), halt().' \
              || echo "== phase: erlang dns probe FAILED =="
            echo "== phase: clone ok, starting rebar3 =="
            (cd "$RUNNER_TEMP/erlbutt" && DEBUG=1 timeout 15m ./rebar3 as prod release)
            echo "== phase: rebar3 release done =="
          else
            make -C "$RUNNER_TEMP/erlbutt" prod
          fi
          echo "== phase: embedding rel into priv/erlbutt =="
          mkdir -p priv/erlbutt
          cp -R "$RUNNER_TEMP/erlbutt/_build/prod/rel/ssb/." priv/erlbutt/
          rm -rf priv/erlbutt/erl_crash.dump priv/erlbutt/log priv/erlbutt/log.offset

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get

      # Digested priv/static must exist in the release: the shell loads
      # http://localhost:24042, which serves these assets.
      - run: mix assets.deploy
      - run: mix release highwire

      # Tauri's externalBin requires the sidecar named after the target
      # triple: binaries/<name>-<triple>[.exe].
      - name: Place the backend as the Tauri sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp "burrito_out/${{ matrix.backend }}" \
             "src-tauri/binaries/${{ matrix.sidecar }}"

      # Notarization pipeline: decode the base64 .p12 into a dedicated
      # keychain that stays on the search path (login keychain kept for
      # the toolchain). The certificate password is regenerated in the
      # same secret-set step as the cert, never echoed.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      # Tauri signs the .app bundle but not externalBin sidecars, so the
      # burrito backend is signed separately — hardened runtime + secure
      # timestamp are required for notarization to accept the bundle.
      - name: Codesign the backend sidecar (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "src-tauri/binaries/${{ matrix.sidecar }}"
          codesign --verify --verbose=2 \
            "src-tauri/binaries/${{ matrix.sidecar }}"

      - run: npm install -g @tauri-apps/cli@2

      # Tauri notarizes (staples) the dmg/app when these are present.
      - name: Tauri build (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: tauri build

      - name: Tauri build (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: tauri build --config tauri.linux.conf.json

      - name: Tauri build (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: tauri build --config tauri.windows.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.triple }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
