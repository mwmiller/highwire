name: Release

# Tag push → four native builds (no cross-compiling: each runner builds
# its own Burrito backend with BURRITO_TARGET, so the enacl NIF links
# against the host), bundles the Tauri shell around it, and attaches the
# installers to the GitHub release for that tag.
#
#   macos-15       → HighWire.app + .dmg   (backend: aarch64-apple-darwin)
#   ubuntu-22.04     → .deb + .rpm + .AppImage (backend: x86_64-unknown-linux-gnu)
#   ubuntu-22.04-arm → .deb + .rpm + .AppImage (backend: aarch64-unknown-linux-gnu)
#   windows-2022   → NSIS -setup.exe       (backend: x86_64-pc-windows-msvc)
#
# Known gaps: the Windows enacl build needs sodium.dll beside the
# backend at runtime (that job is expected to need more work). The
# erlbutt engine IS embedded — this workflow builds its prod profile
# with bundled ERTS into priv/erlbutt, and the sidecar prefers that
# copy's own erts over any system Erlang.
#
# Also runnable by hand (workflow_dispatch) as a build-only dry run:
# all matrix legs build and upload artifacts; the separate, tag-only
# publish job then bundles them into one release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            burrito_target: macos
            backend: highwire_macos
            triple: aarch64-apple-darwin
            sidecar: highwire-backend-aarch64-apple-darwin
            tauri_conf: ""
          - os: ubuntu-22.04
            burrito_target: linux
            backend: highwire_linux
            triple: x86_64-unknown-linux-gnu
            sidecar: highwire-backend-x86_64-unknown-linux-gnu
            tauri_conf: tauri.linux.conf.json
          - os: ubuntu-22.04-arm
            burrito_target: linux_arm
            backend: highwire_linux_arm
            triple: aarch64-unknown-linux-gnu
            sidecar: highwire-backend-aarch64-unknown-linux-gnu
            tauri_conf: tauri.linux.conf.json
          - os: windows-2022
            burrito_target: windows
            backend: highwire_windows.exe
            triple: x86_64-pc-windows-msvc
            sidecar: highwire-backend-x86_64-pc-windows-msvc.exe
            tauri_conf: tauri.windows.conf.json
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.burrito_target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Unix toolchain: every tool pinned in .tool-versions (elixir,
      # erlang, rust, zig, node) in one step. mise has no Windows
      # support — that job sets its toolchain up piecewise below.
      - uses: jdx/mise-action@v4
        if: runner.os != 'Windows'

      - uses: erlef/setup-beam@v1
        if: runner.os == 'Windows'
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: dtolnay/rust-toolchain@1.98.1
        if: runner.os == 'Windows'

      - name: zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "0.16.0"
          $zip = "zig-x86_64-windows-$v.zip"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$v/$zip" -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP 'zig'
          Expand-Archive $zip -DestinationPath $dest
          # The zip nests everything under zig-x86_64-windows-$v/ while
          # we PATH $dest; Burrito finds zig with find_executable, so
          # flatten the tree until zig.exe sits directly in $dest.
          $nested = Join-Path $dest "zig-x86_64-windows-$v"
          if (Test-Path (Join-Path $nested 'zig.exe')) {
            Get-ChildItem $nested -Force | Move-Item -Destination $dest -Force
          }
          if (-not (Test-Path (Join-Path $dest 'zig.exe'))) {
            Write-Host "::error::zig.exe not found after extraction"
            Get-ChildItem $dest | Select-Object -First 20 Name
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dest
          # Burrito's pre_check requires xz on PATH; the image ships none.
          if (-not (Get-Command xz -ErrorAction SilentlyContinue)) {
            choco install xz -y
          }
          if (-not (Get-Command xz -ErrorAction SilentlyContinue)) {
            Write-Host "::error::xz still not on PATH after choco install"
            exit 1
          }
          # Burrito packs the Windows release with 7z; the image has it
          # under Program Files but off PATH.
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            $p7 = 'C:\Program Files\7-Zip'
            if (Test-Path (Join-Path $p7 '7z.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $p7
            } else {
              choco install 7zip -y
            }
          }
          # GITHUB_PATH updates apply to later steps only; call zig by
          # its real path here. Burrito also demands exactly 0.16.0.
          & (Join-Path $dest 'zig.exe') version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          xz --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      # Burrito compiles its C wrapper; enacl links -lsodium and Tauri
      # needs the WebKitGTK stack on Linux.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # The job's default shell is Git bash, whose PATH rewriting lets
      # rustc resolve the coreutils `link` in Git\usr\bin instead of the
      # MSVC linker; pin cargo to the real linker by absolute path.
      - name: Pin MSVC linker for cargo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $link = Join-Path $env:VCToolsInstallDir 'bin\HostX64\x64\link.exe'
          if (-not (Test-Path $link)) {
            Write-Host "::error::MSVC link.exe not found at $link"
            exit 1
          }
          Write-Host "cargo linker: $link"
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link"

      - name: vcpkg libsodium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libsodium:x64-windows
          # vcpkg guarantees installed/<triplet>/{lib,include}. A
          # recursive search for the import lib can match a buildtrees
          # artifact whose sibling include\ has no sodium.h — use the
          # canonical prefix and verify the header is really there.
          $prefix = @($env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg') |
            Where-Object { $_ } | Select-Object -Unique |
            ForEach-Object { Join-Path $_ 'installed\x64-windows' } |
            Where-Object { Test-Path (Join-Path $_ 'include\sodium.h') } |
            Select-Object -First 1
          if (-not $prefix) {
            Write-Host "::error::vcpkg prefix with installed\x64-windows\include\sodium.h not found"
            exit 1
          }
          $libdir = Join-Path $prefix 'lib'
          $lib = @((Join-Path $libdir 'sodium.lib'), (Join-Path $libdir 'libsodium.lib')) |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lib) { Write-Host "::error::sodium import lib not found under $libdir"; exit 1 }
          Write-Host "import lib: $lib"
          Copy-Item $lib (Join-Path $libdir 'libsodium.dll.a')
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$libdir;$env:LIB"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$(Join-Path $prefix 'include');$env:INCLUDE"
          # The port compiler runs gcc-style on this runner (its
          # diagnostics are gcc's; MSVC would read INCLUDE and find
          # the header) — give gcc the same -I/-L knobs the macOS
          # step uses. Forward slashes: gcc on Windows wants them.
          # GCC 14+ also promotes legacy C constructs to errors
          # (LLP64 size_t*/ulong*, C23 defaults) that the Linux/macOS
          # toolchains still accept — keep the unmodified upstream
          # sources compiling exactly as they do there.
          $incf = (Join-Path $prefix 'include') -replace '\\', '/'
          $libf = $libdir -replace '\\', '/'
          $legacy = '-std=gnu17 -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration -Wno-error=return-mismatch'
          Add-Content -Path $env:GITHUB_ENV -Value "CFLAGS=-I$incf $legacy $env:CFLAGS"
          # enacl's port_env adds -lsodium only on Unix — put the lib
          # on the mingw link line ourselves (the dll.a copy above is
          # what ld's -lsodium resolves to).
          Add-Content -Path $env:GITHUB_ENV -Value "LDFLAGS=-L$libf -lsodium $env:LDFLAGS"

      - name: system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libsodium
          # Homebrew's libsodium sits outside clang's default search
          # path, and enacl's port_env only adds -I/-L on FreeBSD and
          # Solaris. Job-wide (GITHUB_ENV): the engine build and mix's
          # own enacl dep both compile against it.
          echo "CFLAGS=-I$(brew --prefix)/include ${CFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"

      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # patchelf lets the release step (HighWire.Release) repoint each
          # bundled enacl NIF at the libsodium it copies beside it.
          sudo apt-get install -y libsodium-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The engine the sidecar spawns: erlbutt's prod release — its own
      # ERTS (so the shipped app needs no system Erlang), the real
      # network id, and native NIFs built for this runner's OS — into
      # priv/. mix release snapshots priv, so it rides inside the
      # Burrito wrapper; the release.yml runtime config points the
      # sidecar at it.
      #
      # erlbutt is a branch-tracking git dep in mix.exs (main), so mix
      # deps.get has already fetched it into deps/erlbutt at the exact
      # revision locked in mix.lock — the engine is built UNMODIFIED
      # from that checkout, and stays in lockstep with the app's other
      # deps. That step runs above this one. Two environment knobs only:
      #
      #   ERL_COMPILER_OPTIONS — OTP 29 deprecates the bare `catch`
      #     idiom the codebase deliberately uses (and the old
      #     binding-in-filter comprehension style); both are fatal
      #     under erlbutt's warnings_as_errors. Suppress the warning
      #     classes rather than patching a repo we build as-is.
      #   CFLAGS/LDFLAGS (macOS) — exported job-wide by the system
      #     libraries step above: Homebrew's libsodium is outside
      #     clang's default search path. apt's Linux paths are already
      #     default; Windows uses the vcpkg INCLUDE/LIB env.
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get

      - name: Build and embed the erlbutt engine
        env:
          ERL_COMPILER_OPTIONS: '[nowarn_deprecated_catch, nowarn_export_var_subexpr]'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # git/hex must fail fast instead of sitting on a credential
            # prompt (a headless hang shows zero output), and rebar3 is
            # bounded so a stall surfaces as a step failure with the
            # last phase marker visible in the log.
            export GIT_TERMINAL_PROMPT=0
            # git-bash exports TMPDIR=/tmp (POSIX), which win32 file
            # ops resolve root-relative (\tmp\...) — rebar3 then hangs
            # 15m in its plugin-install temp move. Pin every temp var
            # under the workspace so source and destination share a
            # drive.
            export TMP="$RUNNER_TEMP/tmp"
            export TEMP="$TMP"
            export TMPDIR="$TMP"
            mkdir -p "$TMP"
            export HEX_HTTP_TIMEOUT=120
            echo "== phase: hex.pm probe =="
            curl -sS -IL --max-time 30 https://repo.hex.pm/tarballs/rebar3_auto-0.6.0.tar \
              -w 'probe: code=%{http_code} time=%{time_total}s\n' -o /dev/null \
              || echo "== phase: hex.pm probe FAILED =="
            echo "== phase: erlang dns probe =="
            timeout 30 erl -noshell -eval \
              'io:format("dns: ~p~n", [inet_res:lookup("repo.hex.pm", in, a)]), halt().' \
              || echo "== phase: erlang dns probe FAILED =="
            # erlbutt's project-wide release pre_hooks call a POSIX
            # script (scripts/stage-plugins.sh: stage the plugins a
            # package ships), and rebar3 starts hooks through cmd on
            # Windows, which cannot run one — the leg dies at "Hook for
            # release failed!". Stage the plugins ourselves under this
            # shell, from the erlbutt root with PLUGINS unset exactly as
            # the other legs have it, so the _build/plugins tree the
            # release overlay copies already exists; then hand cmd a
            # hook it can answer, so the hook still runs and still
            # succeeds. The tree and the script are untouched.
            (cd deps/erlbutt && bash scripts/stage-plugins.sh)
            sed -i 's|"scripts/stage-plugins.sh"|"echo stage-plugins.sh staged by the workflow"|g' \
              deps/erlbutt/rebar.config
            echo "== phase: deps fetched, starting rebar3 =="
            (cd deps/erlbutt && DEBUG=1 timeout 15m ./rebar3 as prod release)
            echo "== phase: rebar3 release done =="
          else
            # The same task `mix setup` runs in dev, at the prod
            # profile: it removes the release dir first (no stale
            # lib/<app>-<oldver> shadow beams), prepends Homebrew
            # libsodium flags when brew is present (Linux needs none
            # anyway: apt's paths are clang's defaults), and drives
            # the dep's vendored rebar3.
            mix engine.build prod
          fi
          echo "== phase: embedding rel into priv/erlbutt =="
          mkdir -p priv/erlbutt
          cp -R deps/erlbutt/_build/prod/rel/ssb/. priv/erlbutt/
          rm -rf priv/erlbutt/erl_crash.dump priv/erlbutt/log priv/erlbutt/log.offset

      # Digested priv/static must exist in the release: the shell loads
      # http://localhost:24042, which serves these assets.
      - run: mix assets.deploy

      # Burrito's default :precompiled ERTS on Linux is the Beam Machine
      # "any" build, which is musl-linked. It cannot load the glibc enacl
      # NIF (and bundled libsodium) that mix release compiles on this
      # runner, so the wrapped backend would boot and then hang on
      # "Connecting…" with a CRYPTO_LOAD on_load_failure. The Tauri shell
      # is glibc-linked anyway (webkit2gtk/GTK), so a glibc backend costs
      # no portability. Package THIS runner's OTP — the same glibc runtime
      # mix release embeds and enacl links against — into the tarball shape
      # Burrito expects (a single otp-*/ top dir, per its README) and hand
      # it to the linux/linux_arm targets as :custom_erts. macOS and
      # Windows keep their precompiled targets; they load their NIFs fine.
      - name: Package host OTP as custom ERTS (Linux)
        if: runner.os == 'Linux'
        run: |
          OTP_ROOT=$(erl -noshell -eval 'io:format("~s",[code:root_dir()]),halt().')
          OTP_VSN=$(erl -noshell -eval 'io:format("~s",[erlang:system_info(otp_release)]),halt().')
          ARCH=$(uname -m)
          WRAP="otp-${OTP_VSN}-linux-${ARCH}"
          STAGE="$RUNNER_TEMP/erts-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE/$WRAP"
          # The tarball must contain the erts-*/ bin + lib trees CopyERTS
          # swaps in; wrap them under otp-*/ so its erts_location/*/lib glob
          # resolves correctly. Copy rather than symlink so tar stores real
          # files, not links into the host tree.
          cp -R "$OTP_ROOT/erts-"* "$STAGE/$WRAP/"
          cp -R "$OTP_ROOT/lib" "$STAGE/$WRAP/lib"
          cp -R "$OTP_ROOT/releases" "$STAGE/$WRAP/releases" 2>/dev/null || true
          cp -R "$OTP_ROOT/usr" "$STAGE/$WRAP/usr" 2>/dev/null || true
          cp -R "$OTP_ROOT/misc" "$STAGE/$WRAP/misc" 2>/dev/null || true
          TARBALL="$RUNNER_TEMP/custom-erts.tar.gz"
          tar -C "$STAGE" -czf "$TARBALL" "$WRAP"
          # Verify the archive is non-empty and well-formed. Capture the
          # listing to a file rather than piping to `head` — a closed pipe
          # sends tar SIGPIPE and a nonzero exit, which set -e would treat
          # as a step failure even though the tarball is fine.
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/erts-listing.txt"
          echo "Packaged custom ERTS from $OTP_ROOT -> $TARBALL ($(wc -l < "$RUNNER_TEMP/erts-listing.txt") entries)"
          head -5 "$RUNNER_TEMP/erts-listing.txt"
          echo "HIGHWIRE_CUSTOM_ERTS=$TARBALL" >> "$GITHUB_ENV"

          # Burrito's Zig wrapper does a comptime @embedFile("musl-runtime.so")
          # in maybe_install_musl_runtime. On Linux that function is always
          # analyzed (IS_LINUX is comptime-true), so Zig requires the file to
          # exist at build time even though we skip FetchMusl — the only step
          # that writes it — by using :custom_erts. The musl branch never runs
          # for a glibc backend (MUSL_RUNTIME_PATH is empty), so an empty
          # placeholder satisfies the embed without shipping a musl loader.
          # macOS/Windows never analyze the function, so they need no file.
          : > deps/burrito/src/musl-runtime.so

      - run: mix release highwire

      # Tauri's externalBin requires the sidecar named after the target
      # triple: binaries/<name>-<triple>[.exe].
      - name: Place the backend as the Tauri sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp "burrito_out/${{ matrix.backend }}" \
             "src-tauri/binaries/${{ matrix.sidecar }}"

      # Notarization pipeline: decode the base64 .p12 into a dedicated
      # keychain that stays on the search path (login keychain kept for
      # the toolchain). The certificate password is regenerated in the
      # same secret-set step as the cert, never echoed.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      # Tauri signs the .app bundle but not externalBin sidecars, so the
      # burrito backend is signed separately — hardened runtime + secure
      # timestamp are required for notarization to accept the bundle.
      - name: Codesign the backend sidecar (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "src-tauri/binaries/${{ matrix.sidecar }}"
          codesign --verify --verbose=2 \
            "src-tauri/binaries/${{ matrix.sidecar }}"

      - run: npm install -g @tauri-apps/cli@2

      # Tauri signs the .app, notarizes it, and staples the ticket onto the
      # bundle — but it never notarizes the .dmg wrapper it then packs that
      # .app into (tauri-apps/tauri#7533, still open). A signed-but-
      # unnotarized dmg is rejected outright by Gatekeeper on macOS 15 and
      # later ("Unnotarized Developer ID"), so the next step submits and
      # staples the dmg itself.
      - name: Tauri build (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: tauri build

      # The .app inside is already notarized and stapled by the build above;
      # the dmg is only signed. Submit the dmg to notarytool (its accepted
      # ticket covers the whole image) and staple it before upload, so the
      # asset published to the release opens without a Gatekeeper override.
      # --wait blocks until Apple answers; the round-trip is a few minutes.
      - name: Notarize and staple the dmg (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          # Fail the build rather than ship an unnotarized dmg: on 15+ this
          # is the difference between an installer that opens and one that
          # bounces with a Gatekeeper warning.
          spctl -a -t open --context context:primary-signature -vv "$dmg"

      - name: Tauri build (Linux)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: tauri build --config tauri.linux.conf.json

      - name: Tauri build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri
        run: tauri build --config tauri.windows.conf.json

      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.triple }}
          # Only the final installers: bundle/** also holds the unpacked
          # .app/AppDir and .deb internals, and publishing those as release
          # assets floods the API into GitHub's secondary rate limit.
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/windows/*.exe
          if-no-files-found: error

      # Dispatch runs carry a branch ref, not a tag to compare against.
      # The publish job's if: already keeps dry runs unpublished; this
      # keeps their legs green too.
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          MIX=$(grep -m1 'version:' mix.exs | sed -E 's/.*version: *"([^"]+)".*/\1/')
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          CARGOT=$(grep -m1 '^version =' src-tauri/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$MIX" != "$TAG" ] || [ "$CONF" != "$TAG" ] || [ "$CARGOT" != "$TAG" ]; then
            echo "Version mismatch: tag=v$TAG mix=$MIX tauri=$CONF cargo=$CARGOT" >&2
            exit 1
          fi

  # Publishing is one job, not one per build leg. It used to sit at the
  # tail of every matrix leg, so each leg that reached it re-created the
  # release and appended its own copy of the generated notes — v1.4.0's
  # body came out as three identical "Full Changelog" lines. With needs:
  # build it waits for all four legs, downloads every installer at once,
  # and writes the release exactly once. Tag-only, as the header says:
  # a workflow_dispatch dry run builds and uploads artifacts, nothing else.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
